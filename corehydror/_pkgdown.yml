url: https://cameronbracken.github.io/corehydro/r

template:
  bootstrap: 5
  bootswatch: flatly
  light-switch: true
  bslib:
    primary: "#6b7f3f"
    # flatly's navbar is ~72px tall (--bs-navbar-padding-y: 1rem), not the 56px
    # pkgdown assumes; without this the fixed navbar overlaps the top of the
    # home-page intro text.
    pkgdown-nav-height: 100px

navbar:
  structure:
    left: [reference]
    right: [mainsite, search, github, lightswitch]
  components:
    mainsite:
      text: Documentation home
      href: https://cameronbracken.github.io/corehydro/

home:
  links:
    - text: Worked examples (main site)
      href: https://cameronbracken.github.io/corehydro/examples/
    - text: Python package reference
      href: https://cameronbracken.github.io/corehydro/reference/

reference:
  - title: Distributions
    desc: >
      The general univariate distribution interface: 38 families with density,
      quantile, seeded random generation, and fitting.
    contents:
      - distribution
      - dist
      - dist_properties
      - dist_fit
      - distribution_names
  - title: Composite distributions
    desc: >
      Five distributions built from other distributions rather than a flat parameter vector --
      truncation, mixtures, competing risks, empirical, and kernel density. Each returns a
      `corehydro_dist` accepted by every `dist_*()` verb.
    contents:
      - dist_truncated
      - dist_mixture
      - dist_competing_risks
      - dist_empirical
      - dist_kde
  - title: Copulas
    desc: >
      The seven bivariate copula families (`copula_names()`), constructed directly or fitted to
      paired data.
    contents:
      - copula
      - copula_fit
      - copula_functions
      - copula_inverse_cdf
      - copula_tail_dependence
      - copula_exceedance
      - copula_bounds
      - copula_params
      - copula_random
      - copula_log_likelihood
      - copula_names
  - title: Multivariate distributions
    desc: >
      The five multivariate distribution families (`mvdist_names()`): multivariate normal and
      Student-t, Dirichlet, multinomial, and bivariate empirical.
    contents:
      - mvdist_normal
      - mvdist_student_t
      - mvdist_dirichlet
      - mvdist_multinomial
      - mvdist_bivariate_empirical
      - mvdist_functions
      - mvdist_moments
      - mvdist_mahalanobis
      - mvdist_inverse_cdf
      - mvdist_interval
      - mvdist_marginal
      - mvdist_conditional
      - mvdist_random
      - mvdist_params
      - mvdist_names
  - title: GEV convenience functions
    contents:
      - gev
      - gev_fit
      - gev_moments
      - gev_quantile_se
  - title: Observation data
    desc: >
      Censored observation frames -- historical and paleoflood intervals, perception
      thresholds, measurement uncertainty, and low outliers -- plus the diagnostics
      computed off them.
    contents:
      - analysis_data
      - analysis_data_summary
      - analysis_data_hypothesis_test
      - analysis_data_statistics
      - threshold_diagnostics
  - title: Models
    desc: >
      The nine RMC.BestFit model families as plain specs, with nonstationary trends and
      per-parameter bounds and priors. Pass one to any analysis in place of a data vector.
    contents:
      - model_univariate
      - model_mixture
      - model_competing_risks
      - model_point_process
      - model_bulletin17c
      - model_ar
      - model_ma
      - model_arima
      - model_arimax
      - model_spatial_gev
      - model_rating_curve
      - model_bivariate
      - trend
      - model_parameter
      - model_validate
      - model_simulate
      - model_log_likelihood
      - model_parameters
  - title: Point-estimate fits
    contents:
      - fit_mle
      - fit_map
  - title: Bayesian and GMM fits
    contents:
      - fit_bayesian
      - fit_gmm
      - fit_gmm_moments
      - fit_diagnostics
      - quantile_variance
  - title: Fit accessor methods
    desc: >
      S3 methods on a `corehydro_fit` (from `fit_mle`, `fit_map`, `fit_bayesian` or `fit_gmm`).
      `print`, `summary`, `coef` and `vcov` are undocumented plain methods and don't appear here.
    contents:
      - logLik.corehydro_fit
      - confint.corehydro_fit
  - title: Frequency analysis
    contents:
      - univariate_analysis
      - fit_distributions
      - bulletin17c_analysis
      - composite_analysis
  - title: Model-family analyses
    contents:
      - mixture_analysis
      - competing_risk_analysis
      - point_process_analysis
      - spatial_gev_analysis
      - bivariate_analysis
      - coincident_frequency_analysis
      - rating_curve_analysis
  - title: Time series
    contents:
      - ar_analysis
      - ma_analysis
      - arima_analysis
      - arimax_analysis
  - title: MCMC
    contents:
      - mcmc_sample
      - mcmc_posterior
  - title: Uncertainty and diagnostics
    contents:
      - bootstrap_analysis
      - bootstrap_custom
      - estimation_diagnostics
      - prior_predictive_check
      - posterior_predictive_check
  - title: Statistics utilities
    contents:
      - mgbt_test
      - box_cox
      - yeo_johnson
      - plotting_positions
      - latin_hypercube
  - title: Correlation and goodness of fit
    desc: >
      Correlation coefficients and the `GoodnessOfFit` metrics (continuous and binary
      classification), plus the information criteria and model-weight verbs used to rank
      candidate fits.
    contents:
      - correlation
      - goodness_of_fit
      - classification_metrics
      - gof_test
      - gof_rmse
      - aic
      - aic_weights
  - title: Statistics
    desc: >
      Sample moments, L-moments, ranks and percentiles, running (online) statistics and
      covariance, autocorrelation and cross-correlation, and the discrete Fourier transform.
    contents:
      - summary_statistics
      - product_moments
      - l_moments
      - ranks
      - percentile
      - running_statistics
      - running_covariance
      - autocorrelation
      - cross_correlation
      - dft
      - dft_real
  - title: Hypothesis tests
    desc: >
      The twelve ported Numerics one- and two-sample parametric and nonparametric hypothesis
      tests (t-tests, the F-test and its two-model form, Jarque-Bera, Wald-Wolfowitz, Ljung-Box,
      Mann-Whitney, Mann-Kendall, the linear trend test).
    contents:
      - hypothesis_test
  - title: Interpolation and regression
    desc: >
      Histogram binning, one- and two-dimensional interpolation with optional axis transforms,
      and ordinary least squares regression.
    contents:
      - histogram
      - interpolate
      - interpolate_2d
      - linear_regression
      - predict.corehydro_lm
  - title: Sampling utilities
    desc: >
      Quasi-random Sobol sequences, deterministic stratification of an interval, and joint
      exceedance probabilities under a dependency structure.
    contents:
      - sobol_sequence
      - stratify
      - joint_probability
  - title: Links and trends
    desc: >
      The Numerics link-function layer (identity, log, logit, and friends) and the trend models
      used by nonstationary distributions and models.
    contents:
      - link_function
      - link
      - link_names
      - trend_predict
      - trend_names
  - title: Optimizers and network routing
    desc: >
      The fourteen ported Numerics optimizers (differential evolution, particle swarm,
      shuffled complex evolution, simulated annealing, multi-start, MLSL, BFGS, Powell,
      ADAM, gradient descent, Nelder-Mead, Brent, golden section, augmented Lagrange)
      over a user-written R objective, and the Dijkstra shortest-path solver from the same
      upstream Optimization namespace.
    contents:
      - optim_minimize
      - optim_constraint
      - shortest_path
  - title: Root finding, integration and differentiation
    desc: >
      The ported Numerics Brent root finder, adaptive Gauss-Kronrod integrator and
      NumericalDerivative routines over a user-written R function.
    contents:
      - root_find
      - root_find_system
      - quadrature
      - quadrature_2d
      - quadrature_nd
      - ode_solve
      - derivative
  - title: Linear algebra and special functions
    desc: >
      The ported Numerics QRDecomposition (Householder reflections) and GaussJordanElimination
      linear-algebra routines, the Debye and Evaluate special functions, and the two non-tabular
      IUnivariateFunction implementations (LinearFunction, PowerFunction).
    contents:
      - qr_decomposition
      - qr_solve
      - gauss_jordan
      - debye
      - polynomial_eval
      - univariate_function
  - title: Paired-data curves
    desc: >
      The ported Paired Data subsystem (OrderedPairedData, UncertainOrderedPairedData) and its
      third IUnivariateFunction implementation, TabularFunction: interpolation and area under a
      curve, three simplification algorithms, sampling an uncertain curve at its mean or a
      quantile, and evaluating a tabular function built from that curve.
    contents:
      - curve_interpolate
      - curve_area
      - curve_simplify
      - uncertain_curve_sample
      - tabular_function
  - title: Machine learning
    desc: >
      The ported Numerics.MachineLearning layer: three unsupervised methods (k-means, Gaussian
      mixture models, Jenks natural breaks) and five supervised ones (decision trees, random
      forests, k-nearest neighbors, Gaussian naive Bayes, and generalized linear models). Each
      trains and answers in one call; a seeded fit is reproducible and agrees bit for bit with
      the identical call in Python.
    contents:
      - ml_kmeans
      - ml_gaussian_mixture
      - ml_jenks_breaks
      - ml_decision_tree
      - ml_random_forest
      - ml_knn
      - ml_naive_bayes
      - ml_glm
  - title: Time-series container
    desc: >
      The ported Numerics TimeSeries container. A time_series() carries dated observations on a
      stated interval; the verbs over it smooth, fill, clip, re-interval, summarize, reduce to
      annual maxima or peaks over a threshold, decompose, and resample. Seeded resampling agrees
      bit for bit with the identical call in Python.
    contents:
      - time_series
      - ts_interval_names
      - ts_moving_average
      - ts_moving_sum
      - ts_cumulative_sum
      - ts_difference
      - ts_standardize
      - ts_sort
      - ts_transform
      - ts_replace_missing
      - ts_interpolate_missing
      - ts_fill_missing_dates
      - ts_clip
      - ts_shift
      - ts_convert_interval
      - ts_statistics
      - ts_hypothesis_test
      - ts_percentiles
      - ts_duration
      - ts_monthly_statistics
      - ts_monthly_percentiles
      - ts_monthly_frequency
      - ts_block_series
      - ts_water_year
      - ts_calendar_year
      - ts_peaks_over_threshold
      - ts_seasonal_decompose
      - ts_resample_knn
      - ts_resample_block_bootstrap
  - title: The generator a callback is handed
    desc: >
      Drawing from the core's seeded random number generator inside a function you write, so
      the run stays reproducible and agrees with the identical run in Python.
    contents:
      - rng_uniform
