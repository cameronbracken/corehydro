project:
  type: website
  output-dir: _site

website:
  title: "corehydro"
  site-url: https://cameronbracken.github.io/corehydro/
  repo-url: https://github.com/cameronbracken/corehydro
  navbar:
    left:
      - text: Examples
        href: examples/index.qmd
      - text: Porting Status
        href: status.qmd
      - text: Python Reference
        href: reference/index.qmd
      - text: R Reference
        href: r/index.html
    right:
      - icon: github
        href: https://github.com/cameronbracken/corehydro
  sidebar:
    - title: Examples
      style: docked
      collapse-level: 1
      contents:
        - examples/index.qmd
        - examples/coverage.qmd
        - auto: "examples/*/*.ipynb"
        - auto: "examples/*/*.qmd"
  page-navigation: true
  page-footer:
    center: >-
      corehydro is an independent open-source port of the USACE-RMC
      [Numerics](https://github.com/USACE-RMC/Numerics) and
      [RMC-BestFit](https://www.rmc.usace.army.mil/Software/RMC-BestFit/)
      libraries. 0BSD licensed.

format:
  html:
    theme:
      light: [flatly, styles/light.scss]
      dark: [darkly, styles/dark.scss]
    toc: true
    code-copy: true
    fig-width: 7
    fig-height: 4.5

execute:
  freeze: auto
  warning: false

quartodoc:
  package: corehydropy
  dir: reference
  title: Python API reference
  sections:
    - title: Distributions
      desc: >-
        The general univariate distribution interface: 38 families with
        density, quantile, seeded random generation, and fitting.
      contents:
        - Distribution
        - distribution_names
    - title: Composite distributions
      desc: >-
        Five distributions built from other distributions rather than a flat parameter vector --
        truncation, mixtures, competing risks, empirical, and kernel density. Each returns a
        `Distribution` accepted by every method on that class.
      contents:
        - dist_truncated
        - dist_mixture
        - dist_competing_risks
        - dist_empirical
        - dist_kde
    - title: Copulas
      desc: >-
        The seven bivariate copula families (`copula_names()`), constructed directly or fitted
        to paired data.
      contents:
        - Copula
        - copula_fit
        - copula_names
    - title: Multivariate distributions
      desc: >-
        The five multivariate distribution families (`mvdist_names()`): multivariate normal and
        Student-t, Dirichlet, multinomial, and bivariate empirical.
      contents:
        - MultivariateDistribution
        - mvdist_normal
        - mvdist_student_t
        - mvdist_dirichlet
        - mvdist_multinomial
        - mvdist_bivariate_empirical
        - mvdist_names
    - title: GEV convenience functions
      desc: >-
        Direct density, distribution, quantile, moments, and fitting
        functions for the Generalized Extreme Value distribution.
      contents:
        - dgev
        - pgev
        - qgev
        - gev_moments
        - gev_fit
    - title: Observation data
      desc: >-
        Censored observation frames -- historical and paleoflood intervals, perception
        thresholds, measurement uncertainty, and low outliers -- plus the diagnostics
        computed off them.
      contents:
        - AnalysisData
        - analysis_data
        - analysis_data_summary
        - analysis_data_hypothesis_test
        - analysis_data_statistics
        - threshold_diagnostics
    - title: Models
      desc: >-
        The nine RMC.BestFit model families as plain specs, with nonstationary trends and
        per-parameter bounds and priors. Pass one to any analysis in place of a data
        sequence.
      contents:
        - Model
        - model_univariate
        - model_mixture
        - model_competing_risks
        - model_point_process
        - model_bulletin17c
        - model_ar
        - model_ma
        - model_arima
        - model_arimax
        - model_spatial_gev
        - model_rating_curve
        - model_bivariate
        - Trend
        - trend
        - ModelParameter
        - model_parameter
        - model_validate
        - model_simulate
        - model_log_likelihood
        - model_parameters
    - title: Point-estimate fits
      desc: >-
        Maximum likelihood and maximum a posteriori point fits, with Hessian-based covariance
        and profile-likelihood confidence intervals.
      contents:
        - Fit
        - fit_mle
        - fit_map
    - title: Bayesian and GMM fits
      contents:
        - fit_bayesian
        - fit_gmm
        - fit_gmm_moments
        - fit_diagnostics
        - quantile_variance
    - title: Frequency analysis
      desc: The main flood-frequency analysis entry points.
      contents:
        - univariate_analysis
        - fit_distributions
        - bulletin17c_analysis
        - composite_analysis
    - title: Model-family analyses
      contents:
        - mixture_analysis
        - competing_risk_analysis
        - point_process_analysis
        - spatial_gev_analysis
        - bivariate_analysis
        - coincident_frequency_analysis
        - rating_curve_analysis
    - title: Time series
      contents:
        - ar_analysis
        - ma_analysis
        - arima_analysis
        - arimax_analysis
    - title: MCMC
      contents:
        - mcmc_sample
        - mcmc_posterior
    - title: Uncertainty and diagnostics
      contents:
        - bootstrap_analysis
        - bootstrap_custom
        - estimation_diagnostics
        - prior_predictive_check
        - posterior_predictive_check
    - title: Statistics utilities
      contents:
        - mgbt_test
        - box_cox_lambda
        - box_cox
        - box_cox_inverse
        - yeo_johnson_lambda
        - yeo_johnson
        - yeo_johnson_inverse
        - plotting_positions
        - latin_hypercube
    - title: Correlation and goodness of fit
      desc: >-
        Correlation coefficients and the `GoodnessOfFit` metrics (continuous and binary
        classification), plus the information criteria and model-weight functions used to rank
        candidate fits.
      contents:
        - correlation
        - goodness_of_fit
        - classification_metrics
        - gof_test
        - gof_rmse
        - aic
        - aicc
        - bic
        - aic_weights
        - rmse_weights
    - title: Statistics
      desc: >-
        Sample moments, L-moments, ranks and percentiles, running (online) statistics and
        covariance, autocorrelation and cross-correlation, and the discrete Fourier transform.
      contents:
        - summary_statistics
        - product_moments
        - l_moments
        - ranks
        - percentile
        - RunningStatistics
        - running_statistics
        - RunningCovariance
        - running_covariance
        - autocorrelation
        - cross_correlation
        - dft
        - dft_real
    - title: Hypothesis tests
      desc: >-
        The twelve ported Numerics one- and two-sample parametric and nonparametric hypothesis
        tests (t-tests, the F-test and its two-model form, Jarque-Bera, Wald-Wolfowitz,
        Ljung-Box, Mann-Whitney, Mann-Kendall, the linear trend test).
      contents:
        - hypothesis_test
    - title: Interpolation and regression
      desc: >-
        Histogram binning, one- and two-dimensional interpolation with optional axis
        transforms, and ordinary least squares regression.
      contents:
        - histogram
        - interpolate
        - interpolate_2d
        - LinearRegressionResult
        - linear_regression
    - title: Sampling utilities
      desc: >-
        Quasi-random Sobol sequences, deterministic stratification of an interval, and joint
        exceedance probabilities under a dependency structure.
      contents:
        - sobol_sequence
        - stratify
        - joint_probability
    - title: Links and trends
      desc: >-
        The Numerics link-function layer (identity, log, logit, and friends) and the trend
        models used by nonstationary distributions and models.
      contents:
        - Link
        - link_function
        - link
        - link_inverse
        - link_derivative
        - link_names
        - trend_predict
        - trend_parameters
        - trend_names
    - title: Optimizers and network routing
      desc: >-
        The fourteen ported Numerics optimizers (differential evolution, particle swarm,
        shuffled complex evolution, simulated annealing, multi-start, MLSL, BFGS, Powell,
        ADAM, gradient descent, Nelder-Mead, Brent, golden section, augmented Lagrange)
        over a user-written Python objective, and the Dijkstra shortest-path solver from the
        same upstream Optimization namespace.
      contents:
        - OptimResult
        - Constraint
        - optim_minimize
        - optim_maximize
        - shortest_path
    - title: Root finding, integration and differentiation
      desc: >-
        The ported Numerics Brent root finder, adaptive Gauss-Kronrod integrator and
        NumericalDerivative routines over a user-written Python function.
      contents:
        - root_find
        - root_find_system
        - quadrature
        - quadrature_2d
        - quadrature_nd
        - QuadratureResult
        - ode_solve
        - derivative
        - gradient
        - hessian
    - title: Linear algebra and special functions
      desc: >-
        The ported Numerics QRDecomposition (Householder reflections) and GaussJordanElimination
        linear-algebra routines, the Debye and Evaluate special functions, and the two
        non-tabular IUnivariateFunction implementations (LinearFunction, PowerFunction).
      contents:
        - qr_decomposition
        - qr_solve
        - gauss_jordan
        - debye
        - polynomial_eval
        - univariate_function
    - title: Paired-data curves
      desc: >-
        The ported Paired Data subsystem (OrderedPairedData, UncertainOrderedPairedData) and its
        third IUnivariateFunction implementation, TabularFunction: interpolation and area under a
        curve, three simplification algorithms, sampling an uncertain curve at its mean or a
        quantile, and evaluating a tabular function built from that curve.
      contents:
        - curve_interpolate
        - curve_area
        - curve_simplify
        - uncertain_curve_sample
        - tabular_function
    - title: The generator a callback is handed
      desc: >-
        Drawing from the core's seeded random number generator inside a function you write, so
        the run stays reproducible and agrees with the identical run in R.
      contents:
        # `Rng` is defined in the pybind11 layer (bindings/callback.cpp), so griffe's static
        # analysis sees only the `Rng = _core.Rng` alias and would render an empty page. `dynamic`
        # imports it instead, which is what picks up the class and method docstrings written on the
        # binding.
        - name: Rng
          dynamic: true
